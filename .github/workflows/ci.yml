name: Qualidade do frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Build, lint, testes e dependências
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalação limpa
        run: npm ci --prefix frontend
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Testes de componentes e rotas
        run: npm test
      - name: Instalar Chromium para os testes de navegador
        run: npm exec --prefix frontend -- playwright install --with-deps --no-shell chromium
      - name: Testes de navegador
        run: npm run test:e2e
      - name: Auditoria de todas as dependências
        run: npm run audit:deps
      - name: Auditoria das dependências de produção
        run: npm run audit:prod
