name: Qualidade do Wiki-Chem

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — build, lint, testes e dependências
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalação limpa
        run: npm ci --prefix frontend
      - name: Build
        run: npm run build:frontend
      - name: Lint
        run: npm run lint:frontend
      - name: Testes de componentes e rotas
        run: npm run test:frontend
      - name: Instalar Chromium para os testes de navegador
        run: npm exec --prefix frontend -- playwright install --with-deps --no-shell chromium
      - name: Testes de navegador
        run: npm run test:e2e
      - name: Auditoria de todas as dependências
        run: npm audit --prefix frontend --audit-level=moderate
      - name: Auditoria das dependências de produção
        run: npm audit --prefix frontend --omit=dev --audit-level=moderate

  backend:
    name: Backend — contratos, migrações e MySQL real
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          # Credenciais efêmeras exclusivas do serviço isolado de testes.
          MYSQL_ROOT_PASSWORD: ci-root-only-not-production
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: wikichem_test_ci
          MYSQL_USER: wikichem_ci
          MYSQL_PASSWORD: ci-app-only-not-production
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      NODE_ENV: test
      LOG_LEVEL: silent
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: wikichem_test_ci
      DB_USER: wikichem_ci
      DB_PASSWORD: ci-app-only-not-production
      DB_TLS: 'false'
      MIGRATION_DB_USER: root
      MIGRATION_DB_PASSWORD: ci-root-only-not-production
      MYSQL_TEST_ALLOW: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Instalação limpa
        run: npm run install:clean
      - name: Build
        run: npm run build:backend
      - name: Lint e TypeScript strict
        run: npm run lint:backend
      - name: Testes unitários e de contrato
        run: npm run test:backend
      - name: Status e execução controlada de migrações
        run: |
          npm run db:status
          npm run db:migrate
          npm run db:migrate
          npm run db:status
      - name: Integração MySQL, cenários negativos e proxy React/API
        run: npm run test:integration
      - name: Preparar esquema para navegador integrado
        run: npm run db:migrate
      - name: Instalar Chromium para identidade real
        run: npm exec --prefix frontend -- playwright install --with-deps --no-shell chromium
      - name: Navegador com autenticação e MySQL reais
        run: npm run test:auth
      - name: Guardar somente capturas mascaradas e medições sem segredos
        uses: actions/upload-artifact@v7
        with:
          name: evidencias-academicas
          path: |
            .artifacts/performance.json
            .artifacts/evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Auditoria de todas as dependências
        run: npm audit --prefix backend --audit-level=moderate
      - name: Auditoria das dependências de produção
        run: npm audit --prefix backend --omit=dev --audit-level=moderate

  demonstracao:
    name: Demonstração local — Compose, isolamento e restauração
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Preparar sistema completo isolado
        run: npm run demo:prepare
      - name: Repetir preparação sem apagar dados
        run: npm run demo:up
      - name: Verificar fluxo, isolamento e backup/restauração real
        run: npm run demo:verify
      - name: Encerrar apenas a demonstração descartável
        if: always()
        run: npm run demo:reset -- --confirm-demo-reset
